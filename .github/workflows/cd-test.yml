name: CD test

# Đưa bản đang chọn lên môi trường TEST (https://test.<tên-miền>) để kiểm tra trước khi merge vào main.
# Cách dùng: đẩy code lên nhánh `test`, hoặc Actions -> CD test -> Run workflow và chọn nhánh bất kỳ.
on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tên image (GHCR yêu cầu chữ thường)
        id: vars
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BACKEND_ORIGIN bị nhúng lúc build (rewrites): FE test phải gọi app-test chứ không phải app của production.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BACKEND_ORIGIN=http://app-test:1007
            NEXT_PUBLIC_WS_URL=
          tags: ${{ steps.vars.outputs.repo }}:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull image FE test và khởi động lại
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/ht' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f compose.prod.yaml pull fe-test
            docker compose -f compose.prod.yaml up -d --no-deps --force-recreate fe-test
            docker logout ghcr.io
            docker image prune -f
