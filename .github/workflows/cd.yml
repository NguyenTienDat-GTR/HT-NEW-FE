name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tên image (GHCR yêu cầu chữ thường)
        id: vars
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BACKEND_ORIGIN và NEXT_PUBLIC_WS_URL được nhúng vào bundle lúc build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BACKEND_ORIGIN=http://app:1007
            NEXT_PUBLIC_WS_URL=
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ github.sha }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chạy trên runner self-hosted đặt ở server 173. Lệnh deploy nằm trong script trên server (chủ server quản lý),
  # runner chỉ được gọi đúng script đó qua sudo.
  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, qlht-173]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Kéo image vừa build và khởi động lại fe trên server 173
        run: sudo -n -u jvs /srv/qlht/deploy-image.sh fe ${{ github.sha }}
